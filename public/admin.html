<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dark-1: #05161A;
      --dark-2: #072E33;
      --teal-1: #0C7075;
      --teal-2: #0F969C;
      --light-1: #6DA5C0;
      --muted: #294D61;
      --accent: #E8503A;
      --white: #F0F7FA;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(170deg, var(--dark-1) 0%, var(--dark-2) 40%, #0a3a40 100%);
      color: var(--white);
      min-height: 100vh;
    }

    /* LOGIN */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-box {
      background: rgba(7, 46, 51, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(109, 165, 192, 0.15);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .login-box h1 {
      font-weight: 900;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .login-box .accent {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--accent);
    }

    .login-box p {
      color: var(--light-1);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .passcode-input {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(109, 165, 192, 0.25);
      border-radius: 12px;
      background: rgba(5, 22, 26, 0.5);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 8px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.3s;
    }

    .passcode-input:focus {
      border-color: var(--teal-2);
    }

    .passcode-input::placeholder {
      letter-spacing: 4px;
      font-size: 1rem;
      color: var(--muted);
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--teal-1), var(--teal-2));
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(15, 150, 156, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(15, 150, 156, 0.45);
    }

    .error-msg {
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    /* DASHBOARD */
    .dashboard { display: none; }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(109, 165, 192, 0.1);
    }

    .dash-header h1 {
      font-weight: 900;
      font-size: 1.5rem;
    }

    .dash-actions {
      display: flex;
      gap: 0.8rem;
    }

    .dash-btn {
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(109, 165, 192, 0.2);
      border-radius: 10px;
      background: rgba(109, 165, 192, 0.1);
      color: var(--light-1);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dash-btn:hover { background: rgba(109, 165, 192, 0.2); }

    .dash-btn.danger { border-color: rgba(232, 80, 58, 0.3); color: var(--accent); }
    .dash-btn.danger:hover { background: rgba(232, 80, 58, 0.15); }

    .stats {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 2rem;
    }

    .stat-card {
      flex: 1;
      background: rgba(7, 46, 51, 0.5);
      border: 1px solid rgba(109, 165, 192, 0.1);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
    }

    .stat-num {
      font-size: 2rem;
      font-weight: 900;
      color: var(--teal-2);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* PHOTO GRID */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1.5rem 2rem;
    }

    .photo-card {
      background: rgba(7, 46, 51, 0.5);
      border: 1px solid rgba(109, 165, 192, 0.1);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .photo-card:hover { transform: translateY(-4px); }

    .photo-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .photo-info {
      padding: 0.8rem 1rem;
    }

    .photo-date {
      font-size: 0.8rem;
      color: var(--light-1);
    }

    .photo-size {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .photo-delete {
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid rgba(232, 80, 58, 0.3);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .photo-delete:hover { background: rgba(232, 80, 58, 0.15); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 1.1rem; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5, 22, 26, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      .stats { flex-direction: column; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .dash-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <h1>Admin <span class="accent">Panel</span></h1>
      <p>Enter passcode to access captured snaps</p>
      <input type="password" class="passcode-input" id="passcodeInput" placeholder="••••" maxlength="4" inputmode="numeric">
      <button class="login-btn" id="loginBtn">Unlock</button>
      <p class="error-msg" id="errorMsg">Wrong passcode. Try again.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h1>📸 Captured <span style="color: var(--teal-2);">Snaps</span></h1>
      <div class="dash-actions">
        <button class="dash-btn" id="refreshBtn">↻ Refresh</button>
        <button class="dash-btn danger" id="clearBtn">🗑 Clear All</button>
        <button class="dash-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="totalSnaps">0</div>
        <div class="stat-label">Total Snaps</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="todaySnaps">0</div>
        <div class="stat-label">Today</div>
      </div>
    </div>

    <div id="photoContainer"></div>
  </div>

  <script>
    let passcode = '';

    // DOM
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const passcodeInput = document.getElementById('passcodeInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const photoContainer = document.getElementById('photoContainer');

    // LOGIN
    async function login() {
      passcode = passcodeInput.value;
      try {
        const res = await fetch('/api/admin/photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });

        if (res.ok) {
          loginScreen.style.display = 'none';
          dashboard.style.display = 'block';
          loadPhotos();
        } else {
          errorMsg.style.display = 'block';
          passcodeInput.value = '';
          passcodeInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error';
        errorMsg.style.display = 'block';
      }
    }

    loginBtn.addEventListener('click', login);
    passcodeInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
      errorMsg.style.display = 'none';
    });

    // LOAD PHOTOS
    async function loadPhotos() {
      try {
        const res = await fetch('/api/admin/photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        const data = await res.json();

        document.getElementById('totalSnaps').textContent = data.count;

        // Count today's
        const today = new Date().toDateString();
        const todayCount = data.photos.filter(p => new Date(p.date).toDateString() === today).length;
        document.getElementById('todaySnaps').textContent = todayCount;

        if (data.photos.length === 0) {
          photoContainer.innerHTML = `
            <div class="empty-state">
              <div class="emoji">📭</div>
              <p>No snaps captured yet. Share the link with your friends!</p>
            </div>
          `;
          return;
        }

        let html = '<div class="photo-grid">';
        data.photos.forEach(photo => {
          const date = new Date(photo.date);
          const sizeKB = (photo.size / 1024).toFixed(1);
          html += `
            <div class="photo-card">
              <img src="${photo.url}" alt="Snap" onclick="openLightbox('${photo.url}')" style="cursor:pointer;">
              <div class="photo-info">
                <div class="photo-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
                <div class="photo-size">${sizeKB} KB</div>
                <button class="photo-delete" onclick="deletePhoto('${photo.name}')">Delete</button>
              </div>
            </div>
          `;
        });
        html += '</div>';
        photoContainer.innerHTML = html;
      } catch (err) {
        photoContainer.innerHTML = '<div class="empty-state"><p>Error loading photos</p></div>';
      }
    }

    // DELETE PHOTO
    async function deletePhoto(filename) {
      if (!confirm('Delete this snap?')) return;
      await fetch(`/api/admin/photo/${filename}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode })
      });
      loadPhotos();
    }

    // CLEAR ALL
    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm('Delete ALL snaps? This cannot be undone.')) return;
      await fetch('/api/admin/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passcode })
      });
      loadPhotos();
    });

    // REFRESH
    document.getElementById('refreshBtn').addEventListener('click', loadPhotos);

    // LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      passcode = '';
      dashboard.style.display = 'none';
      loginScreen.style.display = 'flex';
      passcodeInput.value = '';
    });

    // LIGHTBOX
    function openLightbox(url) {
      const lb = document.createElement('div');
      lb.className = 'lightbox';
      lb.innerHTML = `<img src="${url}" alt="Snap">`;
      lb.addEventListener('click', () => lb.remove());
      document.body.appendChild(lb);
    }

    // Auto-focus
    passcodeInput.focus();
  </script>
</body>
</html>
